<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J'y serai ! · Conférence nationale de la jeunesse</title>
<meta name="description" content="Crée ton affiche « J'y serai ! » pour la Conférence nationale de la jeunesse du 4 décembre 2026 et partage-la en statut WhatsApp.">
<meta property="og:title" content="J'y serai ! · Conférence nationale de la jeunesse">
<meta property="og:description" content="Ajoute ta photo et partage ton affiche en statut WhatsApp.">
<meta property="og:image" content="fond.jpg">
<meta name="theme-color" content="#04123a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#04123a;--gold:#e6c27a;--gold-2:#f0d08a;--orange:#e8690c;--orange-2:#ff8a1f;--muted:#c9d3ea}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{
  font-family:'Poppins',system-ui,sans-serif;color:#fff;background:var(--navy);
  background-image:radial-gradient(ellipse 700px 480px at 0% 0%,rgba(200,69,10,.45),transparent 70%),
                   radial-gradient(ellipse 600px 420px at 100% 0%,rgba(47,118,185,.45),transparent 70%);
  min-height:100vh;padding:18px 16px 32px;
}
.wrap{max-width:520px;margin:0 auto}
header{text-align:center;margin-bottom:14px}
.kicker{display:inline-block;max-width:100%;padding:4px 12px;border-radius:20px;background:linear-gradient(90deg,#c29241,#f0d08a,#c29241);color:#011133;font-size:.7rem;font-weight:700;letter-spacing:1.5px}
h1{margin-top:6px;font-family:'Kaushan Script',cursive;font-weight:400;font-size:2.6rem;line-height:1.15}
canvas{display:block;width:100%;height:auto;border-radius:16px;box-shadow:0 22px 44px rgba(0,0,0,.45);touch-action:none;cursor:pointer;background:#0a1d4a;-webkit-tap-highlight-color:transparent}
canvas:focus-visible,.btn:focus-visible{outline:3px solid var(--gold-2);outline-offset:3px}
.note{margin:12px 0 0;text-align:center;font-size:.95rem;font-weight:600;color:var(--gold-2)}
.actions{display:none;gap:10px;margin-top:14px}
.actions.show{display:grid}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:10px 14px;border-radius:14px;border:0;font:inherit;font-weight:700;font-size:1rem;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn-dl{background:linear-gradient(135deg,var(--orange-2),var(--orange));color:#fff}
.btn-share{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff}
.btn-change{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.55);min-height:48px;font-weight:600}
.row.single{grid-template-columns:1fr}
#file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(1,8,28,.94);display:none;flex-direction:column;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal.show{display:flex}
.modal img{max-width:100%;max-height:72vh;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.modal p{margin-top:14px;text-align:center;font-weight:700;font-size:1.05rem;color:var(--gold-2)}
.modal .btn{margin-top:14px;max-width:280px}
footer{margin-top:22px;text-align:center;font-size:.75rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="kicker">CONFÉRENCE NATIONALE DE LA JEUNESSE · 4 DÉC. 2026</span>
    <h1>J'y serai !</h1>
  </header>

  <canvas id="poster" width="1080" height="1350" tabindex="0" aria-label="Ton affiche J'y serai. Touche le cadre doré pour ajouter ta photo."></canvas>
  <p class="note" id="note">👆 Touche le cadre pour ajouter ta photo</p>
  <input type="file" id="file-input" accept="image/*">

  <div class="actions" id="actions">
    <div class="row" id="main-row">
      <button class="btn btn-dl" id="download-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Télécharger
      </button>
      <button class="btn btn-share" id="share-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/></svg>
        Partager
      </button>
    </div>
    <button class="btn btn-change" id="change-btn">Changer la photo</button>
  </div>

  <footer>RJECI × HES × ANJPP · Vendredi 4 décembre 2026 · Université Félix Houphouët-Boigny</footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Ton affiche">
  <img id="modal-img" alt="Ton affiche J'y serai">
  <p>Appuie longuement sur l'image › Enregistrer</p>
  <button class="btn btn-change" id="close-btn">Fermer</button>
</div>

<script>
(() => {
  const W = 1080, H = 1350;
  const canvas = document.getElementById('poster');
  const ctx = canvas.getContext('2d');
  const fileInput = document.getElementById('file-input');
  const note = document.getElementById('note');
  const actions = document.getElementById('actions');
  const mainRow = document.getElementById('main-row');
  const shareBtn = document.getElementById('share-btn');
  const downloadBtn = document.getElementById('download-btn');
  const changeBtn = document.getElementById('change-btn');
  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modal-img');
  const FILE_NAME = 'jy-serai-conference-jeunesse.jpg';

  const FX = 540, FY = 690;
  const frame = new Path2D();
  frame.addPath(new Path2D('M70 36 C160 -6 330 8 418 58 C484 96 466 214 458 296 C448 394 474 446 404 480 C300 524 132 506 66 454 C8 408 22 326 14 240 C6 150 -6 76 70 36 Z'), new DOMMatrix([1, 0, 0, 1, FX, FY]));
  const BOX = { x: FX + 6, y: FY + 10, w: 472, h: 496 };
  const CX = BOX.x + BOX.w / 2, CY = BOX.y + BOX.h / 2;

  const bg = new Image();
  bg.src = 'fond.jpg';
  let photo = null, ox = 0, oy = 0;

  const cover = () => Math.max(BOX.w / photo.width, BOX.h / photo.height);
  function clampOffsets() {
    const s = cover(), maxX = Math.max(0, (photo.width * s - BOX.w) / 2), maxY = Math.max(0, (photo.height * s - BOX.h) / 2);
    ox = Math.max(-maxX, Math.min(maxX, ox)); oy = Math.max(-maxY, Math.min(maxY, oy));
  }
  function stroke(d, color, width) {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.stroke(new Path2D(d));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    if (bg.complete && bg.naturalWidth) ctx.drawImage(bg, 0, 0, W, H);
    ctx.save(); ctx.clip(frame);
    if (photo) {
      const s = cover(), dw = photo.width * s, dh = photo.height * s;
      ctx.drawImage(photo, CX - dw / 2 + ox, CY - dh / 2 + oy, dw, dh);
    } else {
      const g = ctx.createLinearGradient(BOX.x, BOX.y, BOX.x + BOX.w, BOX.y + BOX.h);
      g.addColorStop(0, '#fdf3e7'); g.addColorStop(.6, '#f3d49c'); g.addColorStop(1, '#e8a95a');
      ctx.fillStyle = g; ctx.fillRect(BOX.x, BOX.y, BOX.w, BOX.h);
      ctx.fillStyle = '#e8690c'; ctx.beginPath(); ctx.arc(CX, CY - 70, 66, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.strokeRect(CX - 34, CY - 92, 68, 46);
      ctx.beginPath(); ctx.moveTo(CX - 14, CY - 92); ctx.lineTo(CX - 8, CY - 104); ctx.lineTo(CX + 8, CY - 104); ctx.lineTo(CX + 14, CY - 92); ctx.stroke();
      ctx.beginPath(); ctx.arc(CX, CY - 69, 13, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#011133'; ctx.textAlign = 'center';
      ctx.font = '700 38px Poppins, sans-serif'; ctx.fillText('TOUCHE ICI', CX, CY + 50);
      ctx.font = '600 26px Poppins, sans-serif'; ctx.fillText('pour ajouter ta photo', CX, CY + 88);
    }
    ctx.restore();
    ctx.save(); ctx.shadowColor = 'rgba(240,208,138,.6)'; ctx.shadowBlur = 18;
    ctx.strokeStyle = '#f0d08a'; ctx.lineWidth = 10; ctx.lineJoin = 'round'; ctx.stroke(frame); ctx.restore();
    ctx.strokeStyle = '#ff7a12'; ctx.lineWidth = 3; ctx.stroke(frame);
    stroke('M820 684 C860 660 900 654 940 660', '#ff8a1f', 9);
    stroke('M848 708 C880 690 910 686 940 690', '#f0d08a', 7);
    stroke('M972 880 C1000 876 1024 878 1046 884', '#f0d08a', 7);
    stroke('M580 1176 C560 1196 548 1210 546 1226', '#ff8a1f', 9);
    stroke('M606 1186 C590 1204 582 1216 580 1228', '#f0d08a', 7);
  }
  bg.onload = draw;
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  const openPicker = () => fileInput.click();

  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    const img = new Image();
    img.onload = () => {
      photo = img; ox = 0; oy = 0; draw();
      actions.classList.add('show');
      note.textContent = '✋ Glisse ta photo pour bien la placer';
    };
    img.src = URL.createObjectURL(file);
    fileInput.value = '';
  });

  // Toucher le cadre = choisir une photo ; glisser = recadrer
  let pressed = false, moved = false, start = null;
  function toPoster(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  const inFrame = (p) => p.x >= BOX.x - 20 && p.x <= BOX.x + BOX.w + 20 && p.y >= BOX.y - 20 && p.y <= BOX.y + BOX.h + 20;
  canvas.addEventListener('pointerdown', (e) => {
    const p = toPoster(e);
    pressed = true; moved = false; start = { x: p.x, y: p.y, ox, oy, inFrame: inFrame(p) };
    if (photo && start.inFrame) canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pressed || !photo || !start.inFrame) return;
    const p = toPoster(e);
    if (!moved && Math.hypot(p.x - start.x, p.y - start.y) < 14) return;
    moved = true;
    ox = start.ox + (p.x - start.x); oy = start.oy + (p.y - start.y);
    clampOffsets(); draw();
  });
  canvas.addEventListener('pointerup', () => {
    if (pressed && !moved && start && !photo) openPicker();
    pressed = false; moved = false;
  });
  canvas.addEventListener('pointercancel', () => { pressed = false; moved = false; });
  canvas.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPicker(); } });
  changeBtn.addEventListener('click', openPicker);

  const getBlob = () => { draw(); return new Promise((res) => canvas.toBlob(res, 'image/jpeg', 0.92)); };
  const isTouch = window.matchMedia('(pointer: coarse)').matches;

  downloadBtn.addEventListener('click', async () => {
    const blob = await getBlob();
    if (isTouch) {
      modalImg.src = canvas.toDataURL('image/jpeg', 0.92);
      modal.classList.add('show');
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = FILE_NAME;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  });
  document.getElementById('close-btn').addEventListener('click', () => modal.classList.remove('show'));

  // Partager : affiché seulement si le téléphone sait partager une image
  const testFile = new File([new Blob(['x'], { type: 'image/jpeg' })], 't.jpg', { type: 'image/jpeg' });
  const canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [testFile] }));
  if (!canShareFiles) { shareBtn.style.display = 'none'; mainRow.classList.add('single'); }
  shareBtn.addEventListener('click', async () => {
    const blob = await getBlob();
    const file = new File([blob], FILE_NAME, { type: 'image/jpeg' });
    try {
      await navigator.share({ files: [file], text: "J'y serai ! Conférence nationale de la jeunesse, vendredi 4 décembre 2026 à l'Université Félix Houphouët-Boigny. Et toi ?" });
    } catch (err) {
      if (err.name !== 'AbortError') downloadBtn.click();
    }
  });

  draw();
})();
</script>
</body>
</html>
